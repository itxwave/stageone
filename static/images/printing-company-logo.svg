<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 350" width="100%" height="100%">
  <defs>
    <filter id="drop-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="1" flood-opacity="0.15"/>
    </filter>
  </defs>

  <style>
    .bold-text {
      font-family: 'Arial Black', 'Impact', sans-serif;
      font-weight: 900;
      font-style: italic;
      fill: #111111;
      font-size: 38px;
      letter-spacing: 0.5px;
    }
    .light-text {
      font-family: 'Helvetica Neue', 'Arial', sans-serif;
      font-weight: 200;
      text-transform: uppercase;
      fill: #222222;
      font-size: 22px;
      letter-spacing: 6px;
    }
  </style>

  <g transform="translate(10, 10)">
    <!-- YELLOW LAYER (Back-Left) -->
    <path d="M 90,110 C 130,55 170,75 195,95 C 165,130 145,150 90,165 C 105,140 100,125 90,110 Z" fill="#FFF200" />

    <!-- MAGENTA LAYER (Middle) -->
    <path d="M 140,85 C 180,45 235,65 255,85 C 220,125 185,155 130,160 C 145,130 145,105 140,85 Z" fill="#E6007E" />

    <!-- CYAN LAYER (Front-Right) -->
    <path d="M 195,65 C 245,45 300,75 315,105 C 275,145 240,160 175,155 C 195,125 200,95 195,65 Z" fill="#00A0E9" />
  </g>

  <!-- TEXT SECTION -->
  <g id="LogoText">
    <!-- PRINTING Text -->
    <text x="200" y="245" text-anchor="middle" class="bold-text">PRINTING</text>
    
    <!-- Color Accents Over "I" and "N" -->
    <g id="accents" transform="translate(0, -3)">
      <rect x="238" y="200" width="6" height="5" fill="#00A0E9" transform="skewX(-10)" />
      <rect x="264" y="200" width="6" height="5" fill="#E6007E" transform="skewX(-10)" />
      <rect x="290" y="200" width="6" height="5" fill="#FFF200" transform="skewX(-10)" />
    </g>

    <!-- COMPANY Text -->
    <text x="204" y="278" text-anchor="middle" class="light-text">COMPANY</text>
  </g>
</svg>